# Builds the Zakat Tracker APK automatically and uploads it as a downloadable artifact.
# You do not need to understand this file. GitHub runs it every time the code is pushed.
#
# Design notes (July 2025+):
# - No third-party SDK-setup action: it has flaked on GitHub runners before.
# - Instead, this uses the Android SDK that GitHub runners usually ship (if present)
#   or downloads the official Android command line tools from dl.google.com itself.

name: Build Zakat Tracker APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          if [ -d /usr/local/lib/android/sdk ]; then
            SDK_DIR="/usr/local/lib/android/sdk"
          else
            SDK_DIR="$HOME/android-sdk"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          SMA="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SMA" ]; then
            echo "Command line tools not found - downloading them"
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK_DIR/cmdline-tools"
            mkdir -p "$SDK_DIR/cmdline-tools/latest"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools"/* "$SDK_DIR/cmdline-tools/latest/"
          fi
          "$SMA" --version
          yes | "$SMA" --licenses > /dev/null || true
          "$SMA" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        run: gradle assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ZakatTracker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
